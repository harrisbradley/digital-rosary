name: Deploy to Raspberry Pi

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RASPI_SSH_KEY }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:github-actions


      - name: Debug home + ssh dir
        shell: bash
        run: |
          set -euxo pipefail
          echo "HOME=$HOME"
          whoami
          pwd
          ls -la "$HOME" || true
          ls -la "$HOME/.ssh" || true
          file "$HOME/.ssh" || true

      - name: Add host to known_hosts
        shell: bash
        run: |
          set -euxo pipefail

          SSH_DIR="$HOME/.ssh"

          # If something created ~/.ssh as a FILE, remove it so mkdir can succeed
          if [ -f "$SSH_DIR" ]; then
            rm -f "$SSH_DIR"
          fi

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          ssh-keyscan -p "${{ secrets.RASPI_PORT }}" -H "${{ secrets.RASPI_HOST }}" >> "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/known_hosts"

      - name: Deploy files via rsync
        shell: bash
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            -e "ssh -p ${{ secrets.RASPI_PORT }}" \
            ./ \
            ${{ secrets.RASPI_USER }}@${{ secrets.RASPI_HOST }}:${{ secrets.RASPI_PATH }}

      - name: Reload nginx
        shell: bash
        run: |
          ssh -p ${{ secrets.RASPI_PORT }} \
            ${{ secrets.RASPI_USER }}@${{ secrets.RASPI_HOST }} \
            "sudo systemctl reload nginx"
