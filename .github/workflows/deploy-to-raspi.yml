name: Deploy to Raspberry Pi

on:
  push:
    branches: [ "firebase-auth-profile" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RASPI_SSH_KEY }}

      - name: Marker - start
        run: echo "=== START DEPLOY JOB ==="

      - name: Check Tailscale auth key secret is present
        shell: bash
        run: |
          echo "Checking Tailscale auth key secret..."
          if [ -z "${{ secrets.TAILSCALE_AUTHKEY }}" ]; then
            echo "❌ Missing TAILSCALE_AUTHKEY secret"
            exit 1
          fi
          echo "✅ TAILSCALE_AUTHKEY looks present"

      - name: Marker - before Tailscale
        run: echo "=== BEFORE TAILSCALE ==="

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:github-actions

      - name: Marker - after Tailscale
        run: echo "=== AFTER TAILSCALE ==="

      - name: Show Tailscale status
        shell: bash
        run: |
          echo "=== TAILSCALE STATUS ==="
          tailscale status || true
          echo "=== RUNNER TAILSCALE IP ==="
          tailscale ip -4 || true

      - name: Debug home + ssh dir
        shell: bash
        run: |
          set -euxo pipefail
          echo "HOME=$HOME"
          whoami
          pwd
          ls -la "$HOME" || true
          ls -la "$HOME/.ssh" || true
          file "$HOME/.ssh" || true

      - name: Connectivity check to Pi over Tailscale (TCP)
        shell: bash
        run: |
          set -euxo pipefail
          echo "Checking TCP connectivity to ${{ secrets.RASPI_HOST }}:${{ secrets.RASPI_PORT }} ..."
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.RASPI_HOST }}/${{ secrets.RASPI_PORT }}"
          echo "✅ TCP connectivity OK"

      - name: Add host to known_hosts
        shell: bash
        run: |
          set -euxo pipefail

          SSH_DIR="$HOME/.ssh"

          # If something created ~/.ssh as a FILE, remove it so mkdir can succeed
          if [ -f "$SSH_DIR" ]; then
            rm -f "$SSH_DIR"
          fi

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          # Prevent ssh-keyscan from hanging forever
          timeout 15 ssh-keyscan -p "${{ secrets.RASPI_PORT }}" -H "${{ secrets.RASPI_HOST }}" >> "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/known_hosts"

      - name: Deploy files via rsync
        shell: bash
        run: |
          set -euxo pipefail
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            -e "ssh -p ${{ secrets.RASPI_PORT }}" \
            ./ \
            ${{ secrets.RASPI_USER }}@${{ secrets.RASPI_HOST }}:${{ secrets.RASPI_PATH }}

      - name: Reload nginx
        shell: bash
        run: |
          set -euxo pipefail
          ssh -p ${{ secrets.RASPI_PORT }} \
            ${{ secrets.RASPI_USER }}@${{ secrets.RASPI_HOST }} \
            "sudo systemctl reload nginx"

      - name: Marker - end
        run: echo "=== DEPLOY COMPLETE ==="
