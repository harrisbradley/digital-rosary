<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prayer Log — Digital Rosary</title>
  <link rel="icon" type="image/png" href="images/logo/plain_logo_v0.1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html"><img src="images/logo/plain_logo_v0.1.png" alt="Digital Rosary" style="width: 50px; height: 50px; object-fit: contain;"><span>Digital Rosary</span></a>
      <div class="nav-links"><label class="dark-mode-toggle-label" aria-label="Toggle dark mode" title="Toggle dark mode"><input type="checkbox" id="darkModeToggle" aria-label="Toggle dark mode"></label><a id="authNavLink" href="login.html" class="button">Log In</a></div>
    </div>
  </nav>

  <main class="wrap">
    <section class="card pad">
      <h1>Prayer Log</h1>
      <p class="muted">Track your rosary prayers over time. Entries are stored locally on your device.</p>

      <div style="margin-top:12px" class="toolbar">
        <button id="addEntryBtn" class="button primary">Add Today's Entry</button>
        <button id="clearLogBtn" class="button">Clear Log</button>
      </div>

      <div style="margin-top:16px">
        <h2 style="margin:0 0 8px">Entries</h2>
        <div id="emptyState" class="muted">No entries yet. Click "Add Today's Entry" to create one.</div>
        <ul id="logList" class="list" style="margin-top:8px"></ul>
      </div>
    </section>
  </main>

  <footer>Made with ❤️ to help you pray.</footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-service.js"></script>
  <script src="js/firestore-service.js"></script>
  <script src="js/dark-mode.js"></script>
  
  <script>
    const LS_KEYS = { TOTAL:'rosary_total_v1', LAST_DATE:'rosary_last_date_v1', STREAK:'rosary_streak_v1', LONGEST_STREAK:'rosary_longest_streak_v1', LOG:'rosary_log_v1' };
    function getLS(k,f){ try{ const v=localStorage.getItem(k); return v===null?f:JSON.parse(v);}catch{return f;} }
    function setLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
    const todayStr = () => new Date().toISOString().slice(0,10);

    const listEl = document.getElementById('logList');
    const emptyEl = document.getElementById('emptyState');
    let currentUserId = null;

    // Check auth state
    authService.onAuthStateChanged((user) => {
      currentUserId = user ? user.uid : null;
      renderLog();
    });

    async function renderLog(){
      listEl.innerHTML = '';
      
      let log = [];
      
      if (currentUserId && window.firestoreService) {
        // Load from Firestore
        const result = await firestoreService.getPrayerLog(currentUserId);
        if (result.success) {
          log = result.data.map(entry => {
            // Get date consistently - prefer entry.date, fallback to createdAt
            let dateStr = entry.date;
            if (!dateStr && entry.createdAt) {
              const date = entry.createdAt?.toDate ? entry.createdAt.toDate() : new Date(entry.createdAt);
              dateStr = date.toISOString().slice(0, 10);
            }
            return {
              date: dateStr,
              notes: entry.notes || ''
            };
          });
        }
      } else {
        // Load from localStorage
        log = getLS(LS_KEYS.LOG, []);
      }
      
      if (log.length === 0){
        emptyEl.style.display='block';
        return;
      }
      emptyEl.style.display='none';
      log.sort((a,b)=> b.date.localeCompare(a.date));
      for(const entry of log){
        const li = document.createElement('li');
        li.style.margin = '8px 0';
        li.innerHTML = `<strong>${entry.date}</strong> — ${entry.notes || 'Rosary prayed'}`;
        listEl.appendChild(li);
      }
    }

    document.getElementById('addEntryBtn').addEventListener('click', async ()=>{
      const date = todayStr();
      
      // Check if already logged today
      let log = [];
      if (currentUserId && window.firestoreService) {
        const result = await firestoreService.getPrayerLog(currentUserId);
        if (result.success) {
          log = result.data.map(e => e.createdAt?.toDate ? e.createdAt.toDate().toISOString().slice(0, 10) : e.date);
        }
      } else {
        log = getLS(LS_KEYS.LOG, []).map(e => e.date);
      }
      
      if (log.includes(date)) {
        alert("You've already added today's entry.");
        return;
      }
      
      const notes = prompt('Optional: add a note for today', '');
      
      if (currentUserId && window.firestoreService) {
        // Save to Firestore
        await firestoreService.addPrayerLogEntry(currentUserId, {
          date: date,
          notes: (notes||'').trim()
        });
        
        // Update stats
        const stats = await firestoreService.getUserStats(currentUserId);
        const currentStats = stats.success ? stats.data : {};
        const last = currentStats.lastDate;
        let streak = currentStats.streak || 0;
        if (last) {
          const y = new Date();
          y.setDate(y.getDate() - 1);
          if (y.toISOString().slice(0, 10) === last) {
            streak = streak + 1;
          } else {
            streak = 1;
          }
        } else {
          streak = 1;
        }
        const currentLongest = Math.max(currentStats.longestStreak || 0, currentStats.streak || 0);
        const newLongest = streak > currentLongest ? streak : currentLongest;
        
        await firestoreService.updateUserStats(currentUserId, {
          total: (currentStats.total || 0) + 1,
          streak: streak,
          longestStreak: newLongest,
          lastDate: date
        });
      } else {
        // Save to localStorage
        const log = getLS(LS_KEYS.LOG, []);
        log.push({ date, notes: (notes||'').trim() });
        setLS(LS_KEYS.LOG, log);
        
        // Also update totals
        const total = getLS(LS_KEYS.TOTAL, 0);
        const last = getLS(LS_KEYS.LAST_DATE, null);
        let streak = getLS(LS_KEYS.STREAK, 0);
        if (last) {
          const y = new Date();
          y.setDate(y.getDate() - 1);
          if (y.toISOString().slice(0, 10) === last) streak = streak + 1;
          else streak = 1;
        } else {
          streak = 1;
        }
        const previousLongest = Math.max(getLS(LS_KEYS.LONGEST_STREAK, 0), getLS(LS_KEYS.STREAK, 0));
        const newLongest = streak > previousLongest ? streak : previousLongest;
        
        setLS(LS_KEYS.TOTAL, total + 1);
        setLS(LS_KEYS.STREAK, streak);
        setLS(LS_KEYS.LONGEST_STREAK, newLongest);
        setLS(LS_KEYS.LAST_DATE, date);
      }
      
      renderLog();
    });

    document.getElementById('clearLogBtn').addEventListener('click', async ()=>{
      if (!confirm('Clear the prayer log?')) return;
      
      if (currentUserId && window.firestoreService) {
        await firestoreService.clearPrayerLog(currentUserId);
      } else {
        setLS(LS_KEYS.LOG, []);
      }
      
      renderLog();
    });

    renderLog();
    
    // Update navigation based on auth state
    authService.onAuthStateChanged((user) => {
      const authLink = document.getElementById('authNavLink');
      if (user) {
        authLink.textContent = 'Profile';
        authLink.href = 'profile.html';
      } else {
        authLink.textContent = 'Log In';
        authLink.href = 'login.html';
      }
    });
  </script>
</body>
</html>
