<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prayer Log — Digital Rosary</title>
  <link rel="icon" type="image/png" href="images/logo/plain_logo_v0.1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html"><img src="images/logo/plain_logo_v0.1.png" alt="Digital Rosary" style="width: 50px; height: 50px; object-fit: contain;"><span>Digital Rosary</span></a>
      <div class="nav-links"><label class="dark-mode-toggle-label" aria-label="Toggle dark mode" title="Toggle dark mode"><input type="checkbox" id="darkModeToggle" aria-label="Toggle dark mode"></label><a id="authNavLink" href="login.html" class="button">Log In</a></div>
    </div>
  </nav>

  <main class="wrap">
    <section class="card pad">
      <h1>Prayer Log</h1>
      <p class="muted">Track your rosary prayers over time. You can log today or add a missed day from the past. Signed-in users sync to the cloud.</p>

      <div class="toolbar" style="margin-top:12px;align-items:flex-end">
        <div style="display:flex;flex-direction:column;gap:4px;min-width:160px">
          <label for="entryDate" class="muted" style="font-size:13px">Prayer date</label>
          <input type="date" id="entryDate" style="padding:10px;border:1px solid var(--muted);border-radius:8px;font-size:16px;font-family:inherit;background:var(--bg);color:inherit">
        </div>
        <button type="button" id="addEntryBtn" class="button primary">Add entry</button>
        <button type="button" id="clearLogBtn" class="button">Clear Log</button>
      </div>

      <div style="margin-top:16px">
        <h2 style="margin:0 0 8px">Entries</h2>
        <div id="emptyState" class="muted">No entries yet. Pick a date and click &quot;Add entry&quot;.</div>
        <ul id="logList" class="list" style="margin-top:8px"></ul>
      </div>
    </section>
  </main>

  <footer>Made with ❤️ to help you pray.</footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-service.js"></script>
  <script src="js/firestore-service.js"></script>
  <script src="js/dark-mode.js"></script>
  
  <script>
    const LS_KEYS = { TOTAL:'rosary_total_v1', LAST_DATE:'rosary_last_date_v1', STREAK:'rosary_streak_v1', LOG:'rosary_log_v1' };
    function getLS(k,f){ try{ const v=localStorage.getItem(k); return v===null?f:JSON.parse(v);}catch{return f;} }
    function setLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
    const localDateStr = (date = new Date()) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };
    const todayStr = () => localDateStr(new Date());
    function getEntryDate(entry) {
      if (!entry) return null;
      if (typeof entry.date === 'string' && entry.date) return entry.date;
      const rawDate = entry.createdAt?.toDate ? entry.createdAt.toDate() : entry.createdAt;
      if (!rawDate) return null;
      const date = rawDate instanceof Date ? rawDate : new Date(rawDate);
      if (Number.isNaN(date.getTime())) return null;
      return localDateStr(date);
    }
    function calculateStreak(dateStrings, referenceDate) {
      const uniqueDates = new Set((dateStrings || []).filter(Boolean));
      let streak = 0;
      let cursor = referenceDate;

      while (cursor && uniqueDates.has(cursor)) {
        streak += 1;
        const [year, month, day] = cursor.split('-').map(Number);
        const previousDay = new Date(year, month - 1, day);
        previousDay.setDate(previousDay.getDate() - 1);
        cursor = localDateStr(previousDay);
      }

      return streak;
    }

    // Latest prayer day in YYYY-MM-DD order
    function maxDateStr(dates) {
      const sorted = [...dates].filter(Boolean).sort();
      return sorted.length ? sorted[sorted.length - 1] : null;
    }

    function initEntryDateInput() {
      const el = document.getElementById('entryDate');
      if (!el) return;
      const t = todayStr();
      el.max = t;
      if (!el.value || el.value > t) el.value = t;
    }

    const listEl = document.getElementById('logList');
    const emptyEl = document.getElementById('emptyState');
    let currentUserId = null;

    // Check auth state
    authService.onAuthStateChanged((user) => {
      currentUserId = user ? user.uid : null;
      initEntryDateInput();
      renderLog();
    });

    async function renderLog(){
      listEl.innerHTML = '';
      
      let log = [];
      
      if (currentUserId && window.firestoreService) {
        // Load from Firestore
        const result = await firestoreService.getPrayerLog(currentUserId);
        if (result.success) {
          log = result.data.map(entry => ({
            id: entry.id,
            date: getEntryDate(entry),
            notes: entry.notes || ''
          }));
        }
      } else {
        // Load from localStorage
        log = getLS(LS_KEYS.LOG, []);
      }
      log = log.filter(entry => entry && entry.date);

      if (log.length === 0){
        emptyEl.style.display='block';
        return;
      }
      emptyEl.style.display='none';
      log.sort((a,b)=> b.date.localeCompare(a.date));
      for(const entry of log){
        listEl.appendChild(buildEntryRow(entry));
      }
    }

    function buildEntryRow(entry) {
      const li = document.createElement('li');
      li.style.cssText = 'margin:8px 0;display:flex;align-items:center;gap:8px;';

      const dateEl = document.createElement('strong');
      dateEl.textContent = entry.date;

      const notesEl = document.createElement('span');
      notesEl.textContent = entry.notes || 'Rosary prayed';
      notesEl.style.flex = '1';

      const editBtn = document.createElement('button');
      editBtn.textContent = 'Edit';
      editBtn.className = 'button';
      editBtn.style.padding = '2px 10px';
      editBtn.setAttribute('aria-label', `Edit notes for ${entry.date}`);
      editBtn.addEventListener('click', () => startEdit(li, entry, notesEl, editBtn));

      li.appendChild(dateEl);
      li.appendChild(document.createTextNode(' — '));
      li.appendChild(notesEl);
      li.appendChild(editBtn);
      return li;
    }

    function startEdit(li, entry, notesEl, editBtn) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = entry.notes || '';
      input.style.cssText = 'flex:1;padding:4px 8px;border:1px solid var(--muted);border-radius:6px;font-size:14px;font-family:inherit;background:var(--bg);color:inherit;';
      input.setAttribute('aria-label', 'Edit prayer notes');

      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Save';
      saveBtn.className = 'button primary';
      saveBtn.style.padding = '2px 10px';

      const cancelBtn = document.createElement('button');
      cancelBtn.textContent = 'Cancel';
      cancelBtn.className = 'button';
      cancelBtn.style.padding = '2px 10px';

      notesEl.replaceWith(input);
      editBtn.replaceWith(saveBtn);
      li.appendChild(cancelBtn);
      input.focus();

      cancelBtn.addEventListener('click', () => renderLog());

      saveBtn.addEventListener('click', async () => {
        const newNotes = input.value.trim();
        if (currentUserId && window.firestoreService) {
          const result = await firestoreService.updatePrayerLogEntry(currentUserId, entry.id, newNotes);
          if (!result.success) {
            alert(`Failed to save: ${result.error}`);
            return;
          }
        } else {
          const localLog = getLS(LS_KEYS.LOG, []);
          const idx = localLog.findIndex(e => e.date === entry.date);
          if (idx >= 0) localLog[idx].notes = newNotes;
          setLS(LS_KEYS.LOG, localLog);
        }
        renderLog();
      });
    }

    document.getElementById('addEntryBtn').addEventListener('click', async ()=>{
      const dateInput = document.getElementById('entryDate');
      const raw = dateInput && dateInput.value;
      if (!raw) {
        alert('Choose a prayer date.');
        return;
      }
      const date = raw;
      const today = todayStr();
      if (date > today) {
        alert('You cannot add a future date.');
        return;
      }

      let logDates = [];
      let knownLogCount = 0;
      if (currentUserId && window.firestoreService) {
        const result = await firestoreService.getPrayerLog(currentUserId);
        if (result.success) {
          knownLogCount = result.data.length;
          logDates = result.data.map(getEntryDate).filter(Boolean);
        }
      } else {
        const localLog = getLS(LS_KEYS.LOG, []);
        knownLogCount = localLog.length;
        logDates = localLog.map(getEntryDate).filter(Boolean);
      }

      if (logDates.includes(date)) {
        alert('You already have an entry for this date.');
        return;
      }

      const notes = prompt(`Optional note for ${date}`, '');

      const allUniqueDates = [...new Set([...logDates, date])];
      // Same rule as the main app: consecutive days ending today (fills gaps when you backfill).
      const streak = calculateStreak(allUniqueDates, today);
      const lastDate = maxDateStr(allUniqueDates);

      if (currentUserId && window.firestoreService) {
        const addResult = await firestoreService.addPrayerLogEntry(currentUserId, {
          date: date,
          notes: (notes || '').trim()
        });
        if (!addResult.success && addResult.error === 'Entry already exists for this date') {
          alert('You already have an entry for this date.');
          return;
        }
        if (!addResult.success) {
          alert(`Failed to add entry: ${addResult.error || 'Unknown error'}`);
          return;
        }

        const stats = await firestoreService.getUserStats(currentUserId);
        const currentStats = stats.success ? stats.data : {};
        const total = Math.max((currentStats.total || 0) + 1, knownLogCount + 1);

        await firestoreService.updateUserStats(currentUserId, {
          total: total,
          streak: streak,
          lastDate: lastDate
        });
      } else {
        const localLog = getLS(LS_KEYS.LOG, []);
        localLog.push({ date, notes: (notes || '').trim() });
        setLS(LS_KEYS.LOG, localLog);
        setLS(LS_KEYS.TOTAL, Math.max(getLS(LS_KEYS.TOTAL, 0) + 1, localLog.length));
        setLS(LS_KEYS.LAST_DATE, lastDate);
        setLS(LS_KEYS.STREAK, streak);
      }

      initEntryDateInput();
      renderLog();
    });

    document.getElementById('clearLogBtn').addEventListener('click', async ()=>{
      if (!confirm('Clear the prayer log?')) return;
      
      if (currentUserId && window.firestoreService) {
        await firestoreService.clearPrayerLog(currentUserId);
      } else {
        setLS(LS_KEYS.LOG, []);
      }
      
      renderLog();
    });

    initEntryDateInput();
    renderLog();

    // Update navigation based on auth state
    authService.onAuthStateChanged((user) => {
      const authLink = document.getElementById('authNavLink');
      if (user) {
        authLink.textContent = 'Profile';
        authLink.href = 'profile.html';
      } else {
        authLink.textContent = 'Log In';
        authLink.href = 'login.html';
      }
    });
  </script>
</body>
</html>
