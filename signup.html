<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Digital Rosary</title>
  <link rel="icon" type="image/png" href="images/logo/plain_logo_v0.1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <img src="images/logo/plain_logo_v0.1.png" alt="Digital Rosary"
          style="width: 50px; height: 50px; object-fit: contain;">
        <span>Digital Rosary</span>
      </a>
      <div class="nav-links">
        <a href="index.html#home">Home</a>
        <a href="login.html">Log In</a>
        <label class="dark-mode-toggle-label" aria-label="Toggle dark mode" title="Toggle dark mode"><input type="checkbox" id="darkModeToggle" aria-label="Toggle dark mode"></label>
      </div>
    </div>
  </nav>

  <main class="container" style="margin-top: 18px; max-width: 400px; margin-left: auto; margin-right: auto;">
    <section class="card pad">
      <h2 style="margin-top:0;">Create Account</h2>
      
      <div id="errorMessage" class="error-message" style="display:none; margin-bottom: 16px;"></div>
      <div id="successMessage" class="success-message" style="display:none; margin-bottom: 16px;"></div>
      
      <form id="signupForm">
        <div style="margin-bottom: 16px;">
          <label for="name" style="display:block; margin-bottom: 6px; font-weight: 500;">Name</label>
          <input type="text" id="name" name="name" required 
            style="width: 100%; padding: 10px; border: 1px solid var(--muted); border-radius: 8px; font-size: 16px;">
        </div>
        
        <div style="margin-bottom: 16px;">
          <label for="email" style="display:block; margin-bottom: 6px; font-weight: 500;">Email</label>
          <input type="email" id="email" name="email" required 
            style="width: 100%; padding: 10px; border: 1px solid var(--muted); border-radius: 8px; font-size: 16px;">
        </div>
        
        <div style="margin-bottom: 16px;">
          <label for="password" style="display:block; margin-bottom: 6px; font-weight: 500;">Password</label>
          <input type="password" id="password" name="password" required minlength="6"
            style="width: 100%; padding: 10px; border: 1px solid var(--muted); border-radius: 8px; font-size: 16px;">
          <div class="muted" style="font-size: 13px; margin-top: 4px;">At least 6 characters</div>
        </div>
        
        <div style="margin-bottom: 16px;">
          <label for="confirmPassword" style="display:block; margin-bottom: 6px; font-weight: 500;">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required
            style="width: 100%; padding: 10px; border: 1px solid var(--muted); border-radius: 8px; font-size: 16px;">
        </div>
        
        <button type="submit" class="button primary" style="width: 100%; margin-bottom: 12px;">
          <span id="signupButtonText">Create Account</span>
          <span id="signupSpinner" style="display:none;">Creating account...</span>
        </button>
      </form>
      
      <div style="text-align: center; margin: 16px 0;">
        <button id="googleSignUpBtn" class="button" style="width: 100%; margin-bottom: 12px;">
          <span style="margin-right: 8px;">🔵</span> Sign up with Google
        </button>
      </div>
      
      <div style="text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--muted);">
        <span class="muted">Already have an account? </span>
        <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">Log In</a>
      </div>
    </section>
  </main>

  <footer>Made with ❤️ to help you pray.</footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-service.js"></script>
  <script src="js/dark-mode.js"></script>
  
  <script>
    // Redirect if already logged in
    authService.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'profile.html';
      }
    });

    // Signup form handler
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');
      const buttonText = document.getElementById('signupButtonText');
      const spinner = document.getElementById('signupSpinner');
      
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      
      // Validate passwords match
      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        return;
      }
      
      if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters';
        errorDiv.style.display = 'block';
        return;
      }
      
      buttonText.style.display = 'none';
      spinner.style.display = 'inline';
      
      const result = await authService.signUpWithEmail(email, password, name);
      
      if (result.success) {
        // Update user profile with name
        await firestoreService.updateUserProfile(result.user.uid, {
          name: name,
          email: email
        });
        
        successDiv.textContent = 'Account created! Redirecting...';
        successDiv.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'profile.html';
        }, 1000);
      } else {
        errorDiv.textContent = result.error;
        errorDiv.style.display = 'block';
        buttonText.style.display = 'inline';
        spinner.style.display = 'none';
      }
    });

    // Google Sign-Up handler
    document.getElementById('googleSignUpBtn').addEventListener('click', async () => {
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');
      
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      
      const result = await authService.signInWithGoogle();
      
      if (result.success) {
        // Update user profile with Google account info
        const user = result.user;
        await firestoreService.updateUserProfile(user.uid, {
          name: user.displayName || 'User',
          email: user.email
        });
        
        successDiv.textContent = 'Account created! Redirecting...';
        successDiv.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'profile.html';
        }, 1000);
      } else {
        errorDiv.textContent = result.error;
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
