<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Why We Pray The Rosary | Digital Rosary</title>
  <meta name="description" content="Why pray the Rosary? Learn about the spiritual benefits and meaning of this ancient prayer practice." />

  <link rel="icon" type="image/png" href="images/logo/plain_logo_v0.1.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html#home">
        <img src="images/logo/plain_logo_v0.1.png" alt="Digital Rosary"
          style="width: 50px; height: 50px; object-fit: contain;">
        <span>Digital Rosary</span>
      </a>

      <div class="nav-links">
        <label class="dark-mode-toggle-label" aria-label="Toggle dark mode" title="Toggle dark mode"><input type="checkbox" id="darkModeToggle" aria-label="Toggle dark mode"></label>
        <a id="authNavLink" href="login.html" class="button">Log In</a>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="container" style="margin-top: 18px;">
    <section class="card pad">
      <h2 style="margin-top:0;">Why We Pray The Rosary</h2>
      <p class="muted">Content coming soon...</p>
    </section>
  </main>

  <footer>Made with ❤️ to help you pray.</footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-service.js"></script>
  <script src="js/dark-mode.js"></script>
  <script>
    // Update navigation based on auth state
    if (window.authService) {
      window.authService.onAuthStateChanged((user) => {
        const authLink = document.getElementById('authNavLink');
        if (authLink) {
          if (user) {
            authLink.textContent = 'Profile';
            authLink.href = 'profile.html';
          } else {
            authLink.textContent = 'Log In';
            authLink.href = 'login.html';
          }
        }
      });
    }
  </script>
</body>
</html>
